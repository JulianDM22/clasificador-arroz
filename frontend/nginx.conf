# Nombre: nginx.conf
# Descripción: Sirve la aplicación de una sola página (todas las rutas caen en index.html) con
#              cabeceras de seguridad, incluida una política de seguridad de contenido (CSP).
# Fecha de creación: 2026-10-18
# Última actualización: 2026-10-18
# Autores: Julian Delgado (@JulianDM22), Cesar Camilo Hoyos Diaz (@Camilo1408)
# Versión: 1.0.0
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8080 https://*.onrender.com; frame-ancestors 'none'" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
